name: AirDoctor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Scenario Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Run Ruff Linter
        run: |
          ruff check app/ core/ mcp_server/ tests/ || true

      - name: Run Core Test Suite
        env:
          LLM_PROVIDER: bedrock
          AWS_REGION: us-east-1
          DEFAULT_CLUSTER: gke-prod-us-central1
        run: |
          python -m unittest discover -s tests/

      - name: Verify Deterministic Incident Scenarios
        run: |
          python demo_runner.py --list
          python demo_runner.py --scenario oom
          python demo_runner.py --scenario deadlock
          python demo_runner.py --scenario schema_drift
